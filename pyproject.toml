[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datamultiplier"
version = "0.1.0"
description = "PostgreSQL test data generator for large-scale relational datasets"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Meang Akira Tanaka", email = "meang.tnk@gmail.com" }
]
license = { text = "MIT" }

dependencies = [
    "click>=8.1.0",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "faker>=20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "flake8>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
datamultiplier = "datamultiplier.cli:main"

[tool.setuptools]
packages = ["datamultiplier"]

[tool.setuptools.package-dir]
datamultiplier = "src/datamultiplier"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
